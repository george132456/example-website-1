<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Быки и Коровы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>БЫКИ И КОРОВЫ</h1>
        <p class="subtitle">Угадайте 4 цифры без повторов</p>
        <p class="attempt-counter">Попытка <span id="attempt-num">1</span> из 10</p>
    </header>

    <main>
        <div class="board" id="board"></div>
        <div class="message" id="message"></div>

        <div class="keyboard" id="keyboard">
            <div class="keypad-row">
                <button class="key" onclick="handleKey('1')">1</button>
                <button class="key" onclick="handleKey('2')">2</button>
                <button class="key" onclick="handleKey('3')">3</button>
                <button class="key" onclick="handleKey('4')">4</button>
                <button class="key" onclick="handleKey('5')">5</button>
            </div>
            <div class="keypad-row">
                <button class="key" onclick="handleKey('6')">6</button>
                <button class="key" onclick="handleKey('7')">7</button>
                <button class="key" onclick="handleKey('8')">8</button>
                <button class="key" onclick="handleKey('9')">9</button>
                <button class="key" onclick="handleKey('0')">0</button>
            </div>
            <div class="keypad-row">
                <button class="key wide" onclick="handleKey('delete')">⌫</button>
                <button class="key wide enter" onclick="handleKey('enter')">ВВОД</button>
                <button class="key wide" onclick="handleKey('restart')">↻</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Мой учебный сайт</p>
    </footer>

    <script src="script.js" onerror="alert('ОШИБКА: script.js не загружен!\n\nПроверьте, что файл называется именно script.js (не script.js.txt) и лежит рядом с index.html')"></script>
</body>
</html>
